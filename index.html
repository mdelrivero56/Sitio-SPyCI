body:not(.ishome){padding-bottom:4.6rem}body.ishome #mbar{display:none}.toast{bottom:5.4rem}
#mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--line);box-shadow:0 -4px 14px #0a2f7a22;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
#mbar a,#mbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.35rem .1rem;font-size:.72rem;font-weight:600;color:var(--blue);min-height:3.4rem;border-radius:10px}
#mbar i{font-style:normal;font-size:1.45rem;line-height:1.5rem}#mbar .on{background:var(--lil);color:var(--pur2)}#mbar .ls{color:#fff;background:var(--pur)}}
/* MODAL ¿QUÉ NECESITO? */
#rq{max-width:520px;width:92vw;max-height:92vh;padding:0;border:3px solid #8a5bd0;border-radius:22px;overflow:auto}
.rq{padding:1.3rem 1.3rem 1.5rem;position:relative}
.rq .x{position:absolute;right:1rem;top:1rem;background:#f3f1f6;border-radius:24px;padding:.65rem 1.1rem;font-weight:600;min-height:2.8rem}
.rq .ico{width:5rem;height:5rem;border-radius:50%;border:3px solid #8a5bd0;display:grid;place-items:center;font-size:2.3rem;background:#fff;overflow:hidden}.rq .ico img{width:3.6rem;height:3.6rem;object-fit:contain}
.rq h2{color:var(--blue);font-size:1.7rem;margin:.9rem 0 .1rem}.rq .su{margin-bottom:.8rem}
.rq .ab2{display:flex;gap:.6rem;flex-wrap:wrap}.rq .ab2 button{border:2.5px solid #8a5bd0;border-radius:30px;padding:.65rem 1.1rem;font-weight:700;color:var(--blue);min-height:3rem}.rq .ab2 button.play{background:#ffbf3c}
.rq h3{color:var(--blue);font-size:1.15rem;margin:1.3rem 0 .5rem}
.rq .it{display:flex;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}.rq .it:last-child{border:0}.rq .it span{font-size:2rem;width:3rem;text-align:center;flex:none}.rq .it img{width:3rem;height:2.4rem;object-fit:contain;flex:none}.rq .it small{display:block;opacity:.8}
.rq .st{display:flex;gap:.9rem;align-items:center;margin:.6rem 0;font-weight:600}.rq .st i{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:#9a6bd0;color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center}
.rq .nt{background:#f3f2ee;border-radius:10px;padding:.9rem 1rem;margin-top:1rem;line-height:1.9}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
