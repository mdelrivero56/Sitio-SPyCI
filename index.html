#mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--line);box-shadow:0 -4px 14px #0a2f7a22;padding:.3rem .2rem calc(.3rem + env(safe-area-inset-bottom))}
#mbar a,#mbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.35rem .1rem;font-size:.72rem;font-weight:600;color:var(--blue);min-height:3.4rem;border-radius:10px}
#mbar i{font-style:normal;font-size:1.45rem;line-height:1.5rem}#mbar .on{background:var(--lil);color:var(--pur2)}#mbar .ls{color:#fff;background:var(--pur)}}
/* MODAL ¿QUÉ NECESITO? */
#rq{max-width:520px;width:92vw;max-height:92vh;padding:0;border:3px solid #8a5bd0;border-radius:22px;overflow:auto}
.rq{padding:1.3rem 1.3rem 1.5rem;position:relative}
.rq .x{position:absolute;right:1rem;top:1rem;background:#f3f1f6;border-radius:24px;padding:.65rem 1.1rem;font-weight:600;min-height:2.8rem}
.rq .ico{width:5rem;height:5rem;border-radius:50%;border:3px solid #8a5bd0;display:grid;place-items:center;font-size:2.3rem;background:#fff;overflow:hidden}.rq .ico img{width:3.6rem;height:3.6rem;object-fit:contain}
.rq h2{color:var(--blue);font-size:1.7rem;margin:.9rem 0 .1rem}.rq .su{margin-bottom:.8rem}
.rq .ab2{display:flex;gap:.6rem;flex-wrap:wrap}.rq .ab2 button{border:2.5px solid #8a5bd0;border-radius:30px;padding:.65rem 1.1rem;font-weight:700;color:var(--blue);min-height:3rem}.rq .ab2 button.play{background:#ffbf3c}
.rq h3{color:var(--blue);font-size:1.15rem;margin:1.3rem 0 .5rem}
.rq .it{display:flex;gap:1rem;align-items:center;padding:.8rem 0;border-bottom:1px solid var(--line)}.rq .it:last-child{border:0}.rq .it span{font-size:2rem;width:3rem;text-align:center;flex:none}.rq .it img{width:3rem;height:2.4rem;object-fit:contain;flex:none}.rq .it small{display:block;opacity:.8}
.rq .st{display:flex;gap:.9rem;align-items:center;margin:.6rem 0;font-weight:600}.rq .st i{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:#9a6bd0;color:#fff;font-style:normal;font-weight:700;display:grid;place-items:center}
.rq .nt{background:#f3f2ee;border-radius:10px;padding:.9rem 1rem;margin-top:1rem;line-height:1.9}
/* MICROSITIO SIMPLE: panel izquierdo + centro */
.det{grid-template-columns:290px minmax(0,1fr);padding:1.2rem 3vw 2rem}
.side button{font-size:1rem;padding:.9rem 1rem;min-height:3.6rem}.side button img{height:2.4rem;width:2.6rem}
.main{min-height:60vh}.hd{padding:1.5rem 1.5rem .6rem}.hd h1{font-size:clamp(1.8rem,3vw,2.6rem)}.hd p{font-size:1.1rem}.pick{color:var(--pur2);font-weight:700;margin-top:1rem}
.info{margin:1rem 1.5rem}.info p{font-size:1rem}.btns button{font-size:1.05rem;min-height:3rem}
@media(max-width:1000px){.det{grid-template-columns:1fr;padding:.8rem 3vw 1.5rem}.side .sg{display:grid;grid-template-columns:1fr 1fr}.side button{flex-direction:column;text-align:center;gap:.3rem;font-size:.9rem;border-left:0;border-bottom:4px solid transparent;border-right:1px solid var(--line);min-height:5.6rem;justify-content:center}.side button span{flex:none}.side button.on{border-bottom-color:var(--pur)}.hd img.il{height:7rem}.pick{display:none}}
@media(max-width:760px){html,body{overflow-x:hidden}.ph>.pill{display:none}.ph>span{display:none}.ph{padding:.5rem 4vw;gap:3vw}.gb .r{flex-wrap:wrap;gap:.6rem;font-size:.8rem}.gb{padding:.5rem 3vw}.gb .r a:not(.x),.gb .r button{white-space:nowrap}}
/* PANEL IZQUIERDO INSTITUCIONAL */
.side{border:1px solid #cfd6e6;border-radius:4px;box-shadow:none;background:#fff}
.side h3{background:var(--navy);color:#fff;border-radius:0;padding:.9rem 1.1rem;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.side h3 img,.side h3 small{display:none}
.side button{border-left:4px solid transparent;border-bottom:1px solid #e3e7f1;padding:.85rem 1rem;font-weight:500;font-size:1rem;gap:.8rem;color:var(--ink);background:#fff}
.side button img{height:1.7rem;width:1.7rem;opacity:.85}
.side button:after{content:"›";margin-left:auto;font-size:1.3rem;color:#8a97b8}
.side button:last-child{border-bottom:0}
.side button:hover{background:#f4f6fb}
.side button.on{background:#e8eefb;border-left-color:var(--navy);font-weight:700;color:var(--navy)}.side button.on:after{color:var(--navy)}
@media(max-width:1000px){.side button{border-left:0;border-bottom:1px solid #e3e7f1;border-right:1px solid #e3e7f1;font-size:.88rem;min-height:5rem}.side button:after{display:none}.side button.on{background:#e8eefb;border-bottom:4px solid var(--navy)}}
/* COLORES INSTITUCIONALES + PANEL SIMPLE */
.det{--blue:#004EAA;--navy:#004EAA;--pur:#9568C6;--pur2:#7d52b0;--lil:#efe9f8}
.side{border:1px solid #d5dbe8}
.side h3{background:#004EAA;font-size:.95rem}
.side button img{display:none}
.side button{padding:1rem 1.1rem;font-size:1.05rem;min-height:3.4rem;border-left:5px solid transparent}
.side button:after{color:#9568C6}
.side button.on{background:#efe9f8;border-left-color:#9568C6;color:#004EAA}.side button.on:after{color:#004EAA}
.btns button,.pill{background:#9568C6}.btns button:hover{background:#7d52b0}
@media(max-width:1000px){.side button{min-height:4rem;border-left:0}.side button.on{border-bottom:4px solid #9568C6}}
/* ELEMENTO GRAFICO EN CADA OPCION DEL PANEL */
.side button img{display:block;flex:none;width:2.6rem;height:2.6rem;padding:.4rem;border-radius:50%;background:#efe9f8;border:2px solid #d9c9ee;object-fit:contain;opacity:1}
.side button.on img{background:#fff;border-color:#9568C6}
@media(max-width:1000px){.side button img{width:2.8rem;height:2.8rem}}
/* ICONOS CLAROS */
.side button .gi{flex:none;width:3rem;height:3rem;border-radius:50%;background:#efe9f8;border:2px solid #d9c9ee;display:grid;place-items:center;font-size:1.6rem;line-height:1;font-weight:400}
.side button.on .gi{background:#fff;border-color:#9568C6}
@media(max-width:1000px){.side button .gi{width:3.2rem;height:3.2rem;font-size:1.8rem}}
.side button .gi svg{width:1.6rem;height:1.6rem}.side button .gi{color:#004EAA}.side button.on .gi{color:#9568C6}
/* DOCUMENTOS, COMO LLEGAR, ATRAS */
.rq .it .da{width:4.6rem;height:3.4rem;flex:none;background:#f6f3fb;border-radius:8px;padding:.15rem}
.rq .su{font-size:.95rem}
.dnd{margin:1rem 1.5rem;border:1px solid #c7d7fb;background:#e8f0ff;border-radius:8px;padding:1rem}
.dnd h3{margin:0 0 .6rem;font-size:1.15rem}.dr{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.dnd figure{margin:0;text-align:center;font-size:.78rem;width:9rem}.dnd figure svg{width:100%;background:#fff;border-radius:8px;padding:.4rem}
.dr>div{flex:1;min-width:14rem}.dnd .btns{margin-top:.7rem}.dnd .how{width:auto;font-size:1rem;padding:.7rem 1.2rem}
.dnd details{margin-top:.9rem;border-top:1px solid #c7d7fb;padding-top:.7rem}.dnd summary{cursor:pointer;font-weight:600;color:var(--blue);min-height:2.4rem}
.md{padding:.5rem 0;border-bottom:1px solid #d5e0fb}.md small{display:block;opacity:.8}
.nav2{display:flex;gap:.6rem;padding:.8rem 1.5rem 0}.nav2 button,.nav2 a{border:2px solid #004EAA;color:#004EAA;border-radius:24px;padding:.5rem 1rem;font-weight:600;background:#fff;min-height:2.6rem;display:inline-flex;align-items:center}.nav2 button:hover,.nav2 a:hover{background:#e8eefb}
@media(max-width:760px){.nav2{display:none}.dnd{margin:1rem}}
dialog{margin:auto}
/* BOCINAS */
.sp2{flex:none;width:2.6rem;height:2.6rem;border-radius:50%;border:2px solid #9568C6;color:#9568C6;background:#fff;display:grid;place-items:center;margin-left:auto;padding:0}.sp2 svg{width:1.3rem;height:1.3rem}.sp2:hover{background:#efe9f8}.sp2.play{background:#ffbf3c;color:#000;border-color:#ffbf3c}
.dnd h3{display:flex;align-items:center;gap:.6rem}.rq .st span{flex:1}.rq .it>div{flex:1}.rq .it .sp2,.rq .st .sp2{margin-left:.4rem}
.rw{display:flex;align-items:center;border-bottom:1px solid #e3e7f1;position:relative}.rw:last-child{border-bottom:0}.rw>button:first-child{flex:1;border-bottom:0}.side .rw>button:first-child:after{display:none}
.side button.sp2{display:grid;width:2.4rem;height:2.4rem;min-height:0;padding:0;border:2px solid #9568C6;border-radius:50%;background:#fff;margin:0 .8rem 0 0;gap:0}.side button.sp2:after{display:none}.side button.sp2.play{background:#ffbf3c}
@media(max-width:1000px){.rw{border-right:1px solid #e3e7f1}.rw>button:first-child{border-right:0!important}.side button.sp2{position:absolute;top:.3rem;right:.3rem;width:2.1rem;height:2.1rem;margin:0}.side button.sp2 svg{width:1.1rem;height:1.1rem}}
.ttl{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap}.ttl .sp2{margin-left:0}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Mejoras de navegación visual, checklist y orientación territorial */
.side button{gap:.7rem;min-height:4.5rem;font-size:1rem}
.side button .gi{width:3.4rem;height:3.4rem;font-size:1.9rem;box-shadow:0 2px 5px #004eaa12}
.side button span{line-height:1.25}
.visual-checklist{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:.7rem;margin:.6rem 0 1rem}
.vdoc{display:flex;align-items:center;gap:.7rem;text-align:left;padding:.8rem;border:2px solid #d5dbe8;border-radius:14px;background:#fff;min-height:116px;width:100%;transition:.15s}
.vdoc:hover,.vdoc:focus-visible{border-color:#9568c6;background:#faf7ff}
.vdoc.checked{border-color:#287849;background:#effaf2}
.vcheck{font-size:1.5rem;color:#004eaa;font-weight:800;flex:none}
.vdoc.checked .vcheck{color:#287849}
.vpic{width:3.5rem;height:3.5rem;display:grid;place-items:center;background:#efe9f8;border-radius:12px;flex:none;font-size:2rem}
.vpic img{width:3rem;height:3rem;object-fit:contain}
.vtext{display:flex;flex-direction:column;gap:.25rem;min-width:0}
.vtext b{color:#004eaa;font-size:1rem}.vtext small{font-size:.82rem;line-height:1.35;color:#263957}
.vtext em{font-style:normal;color:#7044a7;font-size:.8rem;font-weight:700;margin-top:.15rem}
.altpaper{display:flex;align-items:center;justify-content:center;gap:.6rem;width:100%;padding:1rem;margin:.8rem 0 1.2rem;border:2px solid #9568c6;border-radius:12px;background:#f5efff;color:#3c2670;font-weight:800;text-align:center;line-height:1.35}
.altpaper:hover{background:#e9dcff}
.region-label{display:block;font-weight:700;margin:.8rem 0 .35rem}
.region-select{width:100%;padding:.85rem;border:2px solid #a7b5d3;border-radius:10px;background:#fff;color:#14306a;font:inherit}
.region-note{background:#fff8e8;border-left:4px solid #d79a24;padding:.8rem;margin:.7rem 0;font-size:.9rem;line-height:1.4}
.location-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin:.8rem 0}
.map-action,.audio-route{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.8rem 1rem;border-radius:10px;background:#004eaa;color:#fff;font-weight:700;min-height:3rem}
.audio-route{background:#9568c6}.map-action:hover,.audio-route:hover{filter:brightness(.92)}
@media(max-width:600px){.visual-checklist{grid-template-columns:1fr}.vdoc{min-height:100px}.location-actions>*{width:100%}}
</style></head>
