<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pueblos Indígenas de Chihuahua · Gobierno del Estado</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0a2f7a;--blue:#0a4aa8;--ink:#14306a;--pur:#7e47c9;--pur2:#6a38b3;--lil:#eae4fa;--line:#dfe3f3;--fs:16px}
*{box-sizing:border-box;margin:0}html{font-size:var(--fs);scroll-behavior:smooth}
body{font-family:Poppins,'Segoe UI',system-ui,sans-serif;background:#fff;color:var(--ink)}
body.hc{--ink:#000;--blue:#000;--pur:#4a1a9a;--line:#000}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid #ffbf3c;outline-offset:2px}
.gb{background:var(--blue);color:#fff;font-size:.8rem;padding:.55rem 4vw;display:flex;gap:.9rem;align-items:center;flex-wrap:wrap}
.gb a,.gb button{color:#fff;opacity:.95}.gb .lk{color:#8fd0ff}.gb .r{margin-left:auto;display:flex;gap:1rem;align-items:center}
.gb select{background:#ffffff26;color:#fff;border:0;border-radius:14px;padding:.25rem .6rem;font:inherit}.gb option{color:#000}
.ph{background:#fff;display:flex;align-items:center;gap:2vw;padding:.7rem 4vw;border-bottom:1px solid var(--line)}
.ph img{height:3.4rem;width:auto}.ham{font-size:2rem;line-height:1;color:var(--navy)}
.cs{margin-left:auto;display:flex;border-radius:30px;border:1.5px solid #8a5bd0;overflow:hidden;background:#fff;width:min(42vw,520px)}
.cs select{background:var(--pur);color:#fff;border:0;padding:.7rem .9rem;font:600 .82rem Poppins;max-width:11rem}
.cs input{flex:1;border:0;padding:0 1rem;font:inherit;min-width:0;color:var(--ink)}.cs button{background:var(--pur);color:#fff;width:3.2rem;font-size:1.1rem}
.pill{display:inline-flex;align-items:center;gap:.5rem;background:var(--pur);color:#fff;border-radius:30px;padding:.65rem 1.3rem;font-weight:600}.pill:hover{background:var(--pur2)}
/* BANNER */
.banw{overflow-x:auto}
.ban{container-type:inline-size;position:relative;aspect-ratio:1600/534;min-width:760px;overflow:hidden;color:#fff;background:#01479d}
.ban .plate{position:absolute;inset:0;width:100%;height:100%;display:block}
.ab{position:absolute;white-space:nowrap}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .7s;pointer-events:none;z-index:2}.sl.on{opacity:1;pointer-events:auto}
.sl svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.chipt{left:4.7cqw;top:2.05cqw;font-size:1.25cqw;line-height:2.4cqw;font-weight:700;text-transform:uppercase;letter-spacing:.015em}
.kick{left:4.6cqw;top:6.25cqw;font-size:1.4cqw;line-height:2cqw;font-weight:500}
.sl h2{position:absolute;left:4cqw;top:8.4cqw;font-size:3.95cqw;line-height:3.95cqw;font-weight:800;letter-spacing:-.01em;white-space:nowrap}.sl h2 b{display:block;color:#c9a4ff}
.sub{left:4.25cqw;top:17cqw;font-size:1.5cqw;line-height:2cqw;font-weight:500}.sub b{color:#c9a4ff;font-weight:500}
.ent{left:11.45cqw;top:22cqw;font-size:1.56cqw;line-height:2.4cqw;font-weight:700;letter-spacing:.02em;pointer-events:none}
.entl{position:absolute;left:3.9cqw;top:20.7cqw;width:30.5cqw;height:5.1cqw;border-radius:3cqw}.entl:hover{background:#ffffff1f}
.spk{position:absolute;left:36cqw;top:20.9cqw;width:4.7cqw;height:4.7cqw;border-radius:50%;border:.2cqw solid #fff;display:grid;place-items:center;font-size:1.8cqw;background:#ffffff14}
.spk:hover,.spk.play{background:var(--pur)}
.spk:hover:after{content:attr(data-tip);position:absolute;top:100%;margin-top:.6cqw;background:#1d2a44;color:#fff;font-size:1cqw;padding:.5cqw 1cqw;border-radius:.6cqw;white-space:nowrap}
.pl2{top:7.4cqw;width:8cqw;text-align:center;font-size:.95cqw;line-height:1.6cqw;font-weight:500;opacity:.85}.pl2.on{font-weight:700;opacity:1}
.bn{top:29.5cqw;font-size:1.12cqw;line-height:2.1cqw;font-weight:500;z-index:3;color:#fff;opacity:.95}.bn.on{font-weight:700;text-decoration:underline;text-underline-offset:.4cqw}
.sp{top:29.5cqw;font-size:1.12cqw;line-height:2.1cqw;opacity:.6;z-index:3}
.nv{position:absolute;top:26.75cqw;width:3.25cqw;height:3.25cqw;border-radius:50%;background:#fff;color:#0a4aa8;font-size:2.4cqw;font-weight:800;line-height:3cqw;text-align:center;z-index:3}
.dt{position:absolute;top:28cqw;width:.9cqw;height:.9cqw;border-radius:50%;border:.14cqw solid #fff;z-index:3}.dt.on{background:#fff}
.prog{position:absolute;bottom:0;left:0;height:.35cqw;background:#c8a3ff;width:0;z-index:4}
.tiles{display:grid;grid-template-columns:repeat(6,1fr);gap:1rem;padding:1.6rem 4vw}
.tile{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1.2rem .6rem;text-align:center;box-shadow:0 2px 8px #1a3a8a14;transition:.2s}.tile:hover{transform:translateY(-3px);box-shadow:0 8px 18px #1a3a8a2a}
.tile i{font-style:normal;font-size:1.8rem;display:block;margin-bottom:.3rem}.tile b{display:block;font-size:.9rem}.tile small{font-size:.74rem;opacity:.75}
/* LISTADO */
.mh{position:relative;display:flex;align-items:center;gap:2rem;padding:2rem 5vw 2rem 27vw;min-height:15rem;background:linear-gradient(100deg,#0a45a8,#0b55c2);color:#fff;overflow:hidden;flex-wrap:wrap}
.mh .w{position:absolute;left:0;top:0;height:100%;width:26vw;object-fit:cover;object-position:left;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.mh .t{flex:1;min-width:280px;position:relative}.mh small{letter-spacing:.08em;opacity:.85}.mh h1{font-size:clamp(1.7rem,3vw,2.7rem);font-weight:800;margin:.1rem 0 .6rem;line-height:1.1}.mh p{max-width:40rem;font-weight:500;margin-bottom:1.1rem}
.mh .pill{background:#8a55d6;border:1px solid #e6dcff99}
.lis{display:flex;align-items:center;gap:1rem;position:relative}
.bg{width:6.2rem;height:6.2rem;flex:none;border-radius:50%;background:var(--pur);border:.3rem solid #fff;display:grid;place-items:center;font-size:2.4rem;box-shadow:0 0 0 .5rem #ffffff26}.bg.play{background:#ffbf3c}
.lis .bub{background:#dcd0f8;color:#2a2fa0;font-weight:700;font-size:1.1rem;border-radius:2rem;padding:1.1rem 1.4rem;max-width:17rem;line-height:1.3}.lis small{display:block;margin-top:.7rem;font-size:.82rem;opacity:.9;max-width:15rem;letter-spacing:0}
.wrap{padding:2.2rem 4.5vw 3rem}
.wrap h2{border-left:.3rem solid var(--pur);padding-left:.8rem;color:#0a5ad4;font-size:clamp(1.3rem,2vw,1.9rem);font-weight:700}.wrap h2+p{padding-left:1.1rem;margin:.2rem 0 1.4rem}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:1rem}
.card{grid-column:span 2;background:#f9faff;border:1px solid var(--line);border-radius:6px;padding:1rem;text-align:center;display:flex;flex-direction:column;align-items:center;gap:.5rem}
.card img{height:6.4rem;width:auto;max-width:100%;object-fit:contain}.card b{color:var(--blue);font-size:1.05rem}.card small{font-size:.88rem;flex:1}
.card.h{grid-column:span 3;flex-direction:row;text-align:left;gap:1.2rem;align-items:center}.card.h .c{display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}.card.h img{height:6rem}
.how{display:flex;align-items:center;gap:.6rem;background:var(--pur);color:#fff;border-radius:30px;padding:.55rem 1.3rem;font-weight:600;font-size:.92rem;justify-content:center;width:100%}.card.h .how{width:auto}.how:hover{background:var(--pur2)}
.none{padding:2rem;text-align:center}
/* DETALLE */
.sh{position:relative;height:clamp(11rem,22vw,21rem);color:#fff;background:linear-gradient(90deg,#4f7fc0,#3b6bb0 45%,#2f66ae);overflow:hidden;display:flex;align-items:center;padding:0 6vw 0 28vw}
.sh .w{position:absolute;left:0;top:0;height:100%;width:28vw;object-fit:cover;-webkit-mask-image:linear-gradient(90deg,#000 80%,transparent);mask-image:linear-gradient(90deg,#000 80%,transparent)}
.sh .t{position:relative;flex:1}.sh small{font-size:1rem;font-weight:500}.sh h1{font-size:clamp(2rem,4.2vw,3.6rem);font-weight:800;line-height:1.05}.sh p{max-width:34rem;font-weight:500;margin:.3rem 0 .9rem}
.sh .pill{background:#7e47c9;border:1px solid #fff6}
.sh .vz{position:relative;display:flex;align-items:center;gap:1rem;background:#dcd0f8;color:#2a2fa0;border-radius:3rem;padding:.4rem 1.6rem .4rem .4rem;font-weight:700;max-width:22rem;line-height:1.25}
.sh .vz .bg{width:4.4rem;height:4.4rem;font-size:1.6rem}
.det{display:grid;grid-template-columns:270px minmax(0,1fr) 310px;gap:1.2rem;padding:1.1rem 2.5vw 2rem;align-items:start}
.side{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.side h3{display:flex;gap:.8rem;align-items:center;background:linear-gradient(90deg,#6a38b3,#8a55d6);color:#fff;padding:1rem;font-size:1rem;font-weight:700}.side h3 small{display:block;font-weight:400;font-size:.78rem}.side h3 img{height:2.4rem;width:2.4rem;object-fit:contain;background:#fff;border-radius:.4rem;padding:.2rem}
.side button{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;padding:.7rem 1rem;border-bottom:1px solid var(--line);font-weight:600;font-size:.9rem;border-left:4px solid transparent}.side button img{height:2.1rem;width:2.3rem;object-fit:contain}.side button span{flex:1}
.side button.on{background:var(--lil);border-left-color:var(--pur)}.side button:hover{background:#f1ecfc}
.jun{margin:.8rem;background:var(--lil);border-radius:8px;padding:1.1rem;text-align:center;font-style:italic;color:#4a2fa0;font-family:Georgia,serif;font-size:1.05rem}
.main{background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.crumb{display:flex;gap:.6rem;align-items:center;font-size:.82rem;padding:.8rem 1rem;background:#f1f4ff;border-bottom:1px solid var(--line)}.crumb a{color:var(--blue)}.crumb a:hover{text-decoration:underline}
.hd{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;padding:1.2rem 1.2rem .4rem}.hd img.il{height:11rem;width:auto;max-width:19rem;border-radius:2rem 2rem 2rem 2rem;object-fit:contain}
.hd h1{color:var(--blue);font-size:clamp(1.8rem,2.8vw,2.6rem);font-weight:800;line-height:1.1}.hd h4{color:var(--pur);font-size:1.15rem;margin:.2rem 0 .6rem}.hd p{line-height:1.55}
.btns{display:flex;gap:.8rem;flex-wrap:wrap;margin-top:1rem}.btns button{display:flex;align-items:center;gap:.5rem;background:#7e47c9;color:#fff;border-radius:30px;padding:.65rem 1.3rem;font-weight:600}.btns button:hover{background:var(--pur2)}
.info{display:flex;gap:.9rem;align-items:center;background:#e8f0ff;border:1px solid #c7d7fb;border-radius:8px;padding:.9rem 1rem;margin:1rem 1.2rem}.info b{display:block}.info p{font-size:.9rem}
.ic{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;font-style:italic}
.main h3{margin:1rem 1.2rem .6rem;color:var(--blue);font-size:1.25rem}
.need{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin:0 1.2rem}
.need div{border:1px solid var(--line);border-radius:6px;padding:.7rem;font-size:.8rem;background:#fff}.need img{height:2.2rem}.need b{display:block;font-size:.88rem;margin:.3rem 0 .15rem;color:var(--blue)}
.rb{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
.rb h3{display:flex;gap:.6rem;align-items:center;font-size:1.1rem;color:var(--blue)}.rb h3+p{font-size:.85rem;margin:.1rem 0 .7rem 2rem}
.dd{display:flex;align-items:center;gap:.7rem;width:100%;background:linear-gradient(90deg,#6a38b3,#8a55d6);color:#fff;border-radius:8px 8px 0 0;padding:.7rem .9rem;font-weight:600}.dd span{margin-left:auto}
.lst{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px}.lst.h{display:none}
.pl{display:flex;width:100%;gap:.7rem;align-items:center;padding:.6rem .8rem;border-bottom:1px solid var(--line);font-size:.88rem;text-align:left}.pl:last-child{border:0}
.pl i{flex:none;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--pur);color:#fff;font-style:normal;font-size:.6rem;display:grid;place-items:center}.pl:hover i,.pl.play i{background:#ffbf3c;color:#000}
.step{display:flex;gap:.8rem;align-items:center;margin:.7rem 0;font-size:.88rem}.step i{flex:none;width:2rem;height:2rem;border-radius:50%;background:var(--lil);border:2px solid var(--pur);font-style:normal;font-weight:700;display:grid;place-items:center;color:var(--pur2)}
.lbox{display:flex;gap:.8rem;align-items:center;width:100%;text-align:left;background:var(--lil);border-radius:8px;padding:.8rem;font-size:.85rem;margin-top:.6rem}.lbox .bg{width:2.8rem;height:2.8rem;font-size:1rem;border-width:0;box-shadow:none}
dialog{border:0;border-radius:14px;padding:1.5rem;max-width:460px;width:90vw;color:var(--ink)}dialog::backdrop{background:#0008}dialog h3{margin-bottom:.5rem}dialog p,dialog a{display:block;margin:.5rem 0}dialog a{color:var(--blue);font-weight:600}
.toast{position:fixed;bottom:1.2rem;left:50%;transform:translateX(-50%);background:#12306b;color:#fff;padding:.8rem 1.3rem;border-radius:30px;font-size:.88rem;z-index:9;max-width:90vw;display:none}
@media(max-width:1000px){.det{grid-template-columns:1fr}.tiles{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:repeat(2,1fr)}.card,.card.h{grid-column:span 1}.mh,.sh{padding-left:5vw}.mh .w,.sh .w{display:none}.cs{display:none}}
@media(max-width:760px){.tiles{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head>

const DONDE='En las oficinas de la Secretaría de Pueblos y Comunidades Indígenas, ubicadas en Av. Venustiano Carranza No. 803, Col. Obrera, Chihuahua, Chih.';
const PASOS=t=>['Acude a la Secretaría de Pueblos y Comunidades Indígenas.','Presenta tu solicitud y documentación.','Espera la validación del personal.','Recibe la '+(t.f?t.f.charAt(0).toLowerCase()+t.f.slice(1):'confirmación de tu apoyo')+'.'];
const TILES=[['📄','Trámites y servicios','Conoce los requisitos','#/tramites'],['📍','¿Dónde acudir?','Ubica tu módulo más cercano','donde'],['🎓','Becas y apoyos','Impulsa tu educación','#/t/sociales'],['❤️','Salud','Cuida tu bienestar','#/t/salud'],['🏠','Vivienda','Construye tu futuro','#/t/vivienda'],['👥','Programas sociales','Más oportunidades','#/t/sociales']];
const getT=id=>TR.find(x=>x.id===id)||TR[0];
let L='es',cur=0,timer,prog,aud=null,paused=false;
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lname=id=>(LANGS.find(x=>x.id===id)||{n:'Español'}).n;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',3800)}
function stop(){speechSynthesis.cancel();if(aud){aud.pause();aud=null}document.querySelectorAll('.play').forEach(e=>e.classList.remove('play'))}
function tts(x){const u=new SpeechSynthesisUtterance(x);u.lang='es-MX';u.rate=.92;speechSynthesis.speak(u)}
function speak(lang,key,text,btn){const was=btn&&btn.classList.contains('play');stop();if(was)return;if(btn)btn.classList.add('play');
 const fb=()=>{toast('Audio en '+lname(lang)+' pendiente: se lee en español.');tts(text)};
 if(lang==='es'){tts(text);return}
 aud=new Audio(`audio/${lang}/${key}.mp3`);aud.onerror=fb;aud.onended=()=>btn&&btn.classList.remove('play');aud.play().catch(()=>{})}
const langSel=()=>`<select id="sel" aria-label="Idioma"><option value="es">Español</option>${LANGS.map(l=>`<option value="${l.id}">${l.n}</option>`).join('')}</select>`;
function head(kind){
 const bind=()=>{const s=$('#sel');if(s){s.value=L;s.onchange=e=>{L=e.target.value;const i=LANGS.findIndex(x=>x.id===L);if(i>=0&&$('.ban'))go(i);toast('Idioma: '+lname(L))}}
  const f=$('#sf');if(f)f.onsubmit=e=>{e.preventDefault();location.hash='#/tramites?q='+encodeURIComponent($('#q').value)};
  const c=$('#cq');if(c)c.onchange=e=>{if(e.target.value)location.hash='#/t/'+e.target.value}};
 if(kind==='p'){$('#top').innerHTML=`<div class="gb"><span>🏳️ Sitio oficial del Gobierno del Estado de Chihuahua</span><span>|</span><a class="lk" href="#" data-a="como">¿Cómo saberlo?</a><div class="r">${langSel()}<button data-a="acc">♿ Accesibilidad</button></div></div>
 <div class="ph"><button class="ham" data-a="menu" aria-label="Menú">☰</button><a href="#/"><img src="${IMG.cuenta}" alt="Cuenta conmigo"></a><a href="#/"><img src="${IMG.mas}" alt="Más Chihuahua"></a>
 <form class="cs" id="sf"><select id="cq" aria-label="Consultas sugeridas"><option value="">Consultas sugeridas</option>${TR.map(t=>`<option value="${t.id}">${t.n}</option>`).join('')}</select><input id="q" placeholder="Realizar búsqueda" aria-label="Buscar"><button aria-label="Buscar">🔍</button></form></div>`}
 else{$('#top').innerHTML=`<div class="gb"><span>🛡️ Gobierno del Estado de Chihuahua</span><span>|</span><span>Secretaría de Pueblos y Comunidades Indígenas</span><div class="r">${langSel()}<a href="#/">🏠 Inicio</a><a href="#" data-a="transp">Transparencia</a><button data-a="acc">♿ Accesibilidad</button></div></div>
 <div class="ph"><button class="ham" data-a="menu" aria-label="Menú">☰</button><a href="#/"><img src="${IMG.logo}" alt="Chihuahua"></a><span style="border-left:1px solid var(--line);padding-left:1rem;font-weight:700;color:var(--blue);line-height:1.15;font-size:.9rem">Secretaría de<br>Pueblos y Comunidades<br>Indígenas</span>
 <form class="cs" id="sf" style="margin-left:auto"><input id="q" placeholder="Buscar información, trámites o programas…" aria-label="Buscar"><button aria-label="Buscar">🔍</button></form><a class="pill" href="#/tramites">Trámites y servicios ⌄</a></div>`}
 bind()}
function panelSvg(i){const P=k=>{const B=903+132*k,x=y=>B+(360-y)*.16;return `M${x(50)} 50L${x(50)+132} 50L${B+132} 360L${B} 360Z`};
 return `<defs><linearGradient id="dg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#001a5a" stop-opacity=".42"/><stop offset=".75" stop-color="#001a5a" stop-opacity=".3"/><stop offset="1" stop-color="#001a5a" stop-opacity="0"/></linearGradient></defs>`+[0,1,2,3,4].filter(k=>k!==i).map(k=>`<path d="${P(k)}" fill="url(#dg)"/>`).join('')+`<path d="${P(i)}" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="2"/>`}
const PX=[1017,1146,1277,1409,1539],BX=[71,201,338,430,551],SX=[180,316,408,527];
const c=x=>(x/16).toFixed(2)+'cqw';
function home(){
 head('p');
 $('#app').innerHTML=`<div class="banw"><section class="ban" aria-roledescription="carrusel" aria-label="Los 5 pueblos indígenas de Chihuahua"><img class="plate" src="${IMG.plate}" alt="">
 ${LANGS.map((l,i)=>`<div class="sl${i?'':' on'}"><svg viewBox="0 0 1600 534" preserveAspectRatio="none">${panelSvg(i)}</svg>
 <span class="ab chipt">${esc(T(l.id,'chip'))}</span><span class="ab kick">${esc(T(l.id,'kick'))}</span>
 <h2>${esc(T(l.id,'h1a'))}<b>${esc(T(l.id,'h1b'))}</b></h2><span class="ab sub">${esc(T(l.id,'sub')).replace(/(\sy\smás…)$/,'<b>$1</b>')}</span>
 <span class="ab ent">${esc(T(l.id,'enter'))}</span><a class="entl" href="#/tramites" aria-label="${esc(T(l.id,'enter'))}"></a>
 <button class="spk" data-a="bn" data-i="${i}" data-tip="Escuchar mensaje" aria-label="Escuchar mensaje en ${l.n}">🔊</button>
 ${LANGS.map((m,k)=>`<span class="ab pl2${k===i?' on':''}" style="left:calc(${c(PX[k])} - 4cqw)">${m.n}</span>`).join('')}</div>`).join('')}
 ${LANGS.map((l,i)=>`<button class="ab bn${i?'':' on'}" data-a="dot" data-i="${i}" style="left:${c(BX[i])}">${l.n}</button>`).join('')}${SX.map(x=>`<span class="ab sp" style="left:${c(x)}">|</span>`).join('')}
 <button class="nv" style="left:81.9cqw" data-a="prev" aria-label="Anterior">‹</button><button class="nv" style="left:86.25cqw" data-a="next" aria-label="Siguiente">›</button>
 ${LANGS.map((l,i)=>`<button class="dt${i?'':' on'}" data-a="dot" data-i="${i}" aria-label="${l.n}" style="left:${c(1456+24*i)}"></button>`).join('')}<div class="prog" id="prog"></div></section></div>
 <div class="tiles">${TILES.map(t=>`<a class="tile" ${t[3]==='donde'?'href="#" data-a="donde"':`href="${t[3]}"`}><i>${t[0]}</i><b>${t[1]}</b><small>${t[2]}</small></a>`).join('')}</div>`;
 const h=$('.ban');h.onmouseenter=()=>paused=true;h.onmouseleave=()=>paused=false;h.onfocusin=()=>paused=true;h.onfocusout=()=>paused=false;
 cur=0;start()}
function go(i){cur=(i+LANGS.length)%LANGS.length;
 document.querySelectorAll('.sl').forEach((e,k)=>e.classList.toggle('on',k===cur));
 document.querySelectorAll('.dt,.bn').forEach(e=>e.classList.toggle('on',+e.dataset.i===cur));start()}
function start(){clearInterval(timer);cancelAnimationFrame(prog);let t0=performance.now(),last=t0;const bar=$('#prog');
 const tick=n=>{if(!bar||!document.body.contains(bar))return;if(paused)t0+=n-last;last=n;bar.style.width=Math.min(100,(n-t0)/60)+'%';prog=requestAnimationFrame(tick)};prog=requestAnimationFrame(tick);
 timer=setInterval(()=>{if(!paused){stop();go(cur+1)}},6000)}
function listado(q){
 head('p');const f=TR.filter(t=>!q||(t.n+t.s+t.d).toLowerCase().includes(q.toLowerCase()));const ord=ORD.filter(id=>f.includes(getT(id)));
 const card=id=>{const t=getT(id),h=id==='funerario'||id==='estancia';
  return h?`<div class="card h"><img src="${IMG[t.img]}" alt=""><div class="c"><b>${t.n}</b><small>${t.s}</small><a class="how" href="#/t/${id}">📄 Cómo se hace ›</a></div></div>`:`<div class="card"><img src="${IMG[t.img]}" alt=""><b>${t.n}</b><small>${t.s}</small><a class="how" href="#/t/${id}">📄 Cómo se hace ›</a></div>`};
 $('#app').innerHTML=`<section class="mh"><img class="w" src="${IMG.woman}" alt=""><div class="t"><small>MICROSITIO</small><h1>Pueblos Indígenas de Chihuahua</h1><p>Aquí encontrarás información clara y sencilla sobre los apoyos, programas y trámites del Gobierno del Estado, pensados para nuestras comunidades.</p><a class="pill" href="#" data-a="goto">Conoce los trámites y apoyos ➜</a></div>
 <div class="lis"><button class="bg" data-a="page" aria-label="Escuchar">🔊</button><div><div class="bub">Escucha esta información en tu idioma</div><small>Haz clic en el ícono de la bocina para escuchar el contenido.</small></div></div></section>
 <div class="wrap" id="grid"><h2>Trámites y apoyos para nuestras comunidades</h2><p>Selecciona el trámite que necesitas y consulta qué se requiere y cómo hacerlo.${q?` Resultados para “${esc(q)}”.`:''}</p>
 ${ord.length?`<div class="grid">${ord.map(card).join('')}</div>`:'<div class="none">No encontramos resultados. Prueba con otra palabra.</div>'}</div>`;scrollTo(0,0)}
function detalle(id){
 head('s');const t=getT(id),pasos=PASOS(t);
 const secs=[['nombre','Nombre del trámite',t.n],['sirve','¿Para qué sirve?',t.d],['quien','¿Quiénes pueden solicitarlo?',t.w],['docs','Documentos necesarios',NEED.map(n=>n[1]).join(', ')],['pasos','Pasos para realizarlo',pasos.join(' ')]];
 const need=NEED.concat(id==='funerario'?[['n1','Acta de defunción','Del familiar fallecido.']]:[]);
 $('#app').innerHTML=`<section class="sh"><img class="w" src="${IMG.dwoman}" alt=""><div class="t"><small>Pueblos y comunidades indígenas de Chihuahua</small><h1>Apoyos y servicios</h1><p>Conoce los trámites, apoyos y programas que el Gobierno del Estado pone a tu disposición para mejorar tu bienestar y el de tu comunidad.</p><a class="pill" href="#/tramites">Conoce más ➜</a></div>
 <button class="vz" data-a="page"><span class="bg">🔊</span>Escucha esta información en voz alta</button></section>
 <div class="det"><aside><div class="side"><h3><img src="${IMG.s2}" alt=""><span>TRÁMITES Y APOYOS<small>Selecciona el servicio que necesitas</small></span></h3>
 ${SIDE.map(s=>{const x=getT(s);return`<button class="${s===id?'on':''}" data-a="to" data-id="${s}"><img src="${IMG[x.ic]}" alt=""><span>${x.n}</span>›</button>`}).join('')}
 <div class="jun">Juntos por nuestras comunidades indígenas</div></div></aside>
 <main class="main"><div class="crumb"><a href="#/">🏠 Inicio</a> › <a href="#/tramites">Trámites y apoyos</a> › <span>${t.n}</span></div>
 <div class="hd"><img class="il" src="${IMG[t.big||t.img]}" alt=""><div style="flex:1;min-width:240px"><h1>${t.n}</h1><h4>${t.sub}</h4><p>${t.d}</p>
 <div class="btns"><button data-a="read">🔊 Escuchar información</button><button data-a="need">📄 ¿Qué necesito?</button></div></div></div>
 <div class="info"><span class="ic">i</span><div><b>¿Quiénes pueden solicitarlo?</b><p>${t.w}</p></div></div>
 <h3 id="need">¿Qué necesito?</h3><div class="need">${need.map(n=>`<div><img src="${IMG[n[0]]}" alt=""><b>${n[1]}</b>${n[2]}</div>`).join('')}</div>
 <div class="info" style="margin-top:1rem"><span class="ic">📍</span><div><b>¿Dónde acudir?</b><p>${DONDE}</p></div></div>
 ${t.url?`<div style="margin:0 1.2rem 1.2rem"><a class="pill" href="${t.url}" target="_blank" rel="noopener">Hacer el trámite en línea</a></div>`:''}</main>
 <aside><div class="rb"><h3>🎧 Escucha la información</h3><p>Selecciona qué parte deseas escuchar:</p><button class="dd" data-a="dd">🔊 Nombre del trámite <span>⌄</span></button>
 <div class="lst" id="lst">${secs.map(s=>`<button class="pl" data-a="sec" data-k="${t.id}.${s[0]}" data-t="${esc(s[1]+'. '+s[2])}"><i>▶</i>${s[1]}</button>`).join('')}</div></div>
 <div class="rb"><h3>📋 Pasos para hacerlo</h3>${pasos.map((p,i)=>`<div class="step"><i>${i+1}</i><span>${p}</span></div>`).join('')}
 <button class="lbox" data-a="sec" data-k="${t.id}.todo" data-t="${esc(t.n+'. '+t.d+' '+t.w+' '+pasos.join(' '))}"><span class="bg">🔊</span>Puedes escuchar cada sección por separado o toda la información.</button></div></aside></div>`;
 window._t=t;scrollTo(0,0)}
function modal(t,h){const d=$('#dlg');d.innerHTML=`<h3>${t}</h3>${h}<div class="btns"><button onclick="this.closest('dialog').close()">Cerrar</button></div>`;d.showModal()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a;
 if(a!=='dd'&&a!=='sec'&&a!=='bn'&&a!=='page'&&a!=='read'&&a!=='need'&&b.tagName==='A')e.preventDefault&&b.getAttribute('href')==='#'&&e.preventDefault();
 if(a==='next'){stop();go(cur+1)}else if(a==='prev'){stop();go(cur-1)}
 else if(a==='dot'){stop();go(+b.dataset.i);if(b.classList.contains('bn')){L=LANGS[cur].id;const s=$('#sel');if(s)s.value=L}}
 else if(a==='bn'){const l=LANGS[+b.dataset.i];speak(l.id,'banner',ES.banner,b)}
 else if(a==='page'){e.preventDefault();speak(L,'micrositio','Pueblos Indígenas de Chihuahua. Aquí encontrarás información clara y sencilla sobre los apoyos, programas y trámites del Gobierno del Estado, pensados para nuestras comunidades.',b)}
 else if(a==='sec')speak(L,b.dataset.k,b.dataset.t,b)
 else if(a==='read'){const t=window._t;speak(L,t.id+'.todo',t.n+'. '+t.d+' '+t.w+' '+PASOS(t).join(' '),b)}
 else if(a==='need')$('#need').scrollIntoView({behavior:'smooth'})
 else if(a==='goto')$('#grid').scrollIntoView({behavior:'smooth'})
 else if(a==='dd')$('#lst').classList.toggle('h')
 else if(a==='to')location.hash='#/t/'+b.dataset.id
 else if(a==='acc'){const c=document.body.classList.toggle('hc');document.documentElement.style.setProperty('--fs',c?'18px':'16px');toast(c?'Accesibilidad: alto contraste y letra grande activados.':'Accesibilidad desactivada.')}
 else if(a==='menu')modal('Menú','<a href="#/" onclick="dlg.close()">Inicio</a><a href="#/tramites" onclick="dlg.close()">Trámites y apoyos</a>'+TR.map(t=>`<a href="#/t/${t.id}" onclick="dlg.close()">${t.n}</a>`).join(''))
 else if(a==='donde')modal('¿Dónde acudir?','<p>'+DONDE+'</p><p>Pide un intérprete en tu lengua. Puedes ir con una persona de confianza.</p>')
 else if(a==='como')modal('¿Cómo saberlo?','<p>Este es un sitio oficial del Gobierno del Estado de Chihuahua.</p>')
 else if(a==='transp')modal('Transparencia','<p>Consulta la información de transparencia en el portal chihuahua.gob.mx.</p>')});
function route(){stop();clearInterval(timer);cancelAnimationFrame(prog);const h=location.hash.replace(/^#\/?/,'');
 if(h.startsWith('t/'))detalle(h.slice(2));else if(h.startsWith('tramites'))listado(new URLSearchParams(h.split('?')[1]||'').get('q'));else home()}
addEventListener('hashchange',route);route();
</script></body></html>
